<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Transcriber</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cstyle%3E.a%7Bstop-color:%238a6cff%7D.b%7Bstop-color:%233426a8%7D.w%7Bfill:%23fff%7D.t%7Bfill:%23fff%3Bfill-opacity:.92%7D%40media (prefers-color-scheme:dark)%7B.a%7Bstop-color:%232e2650%7D.b%7Bstop-color:%23120e22%7D.w%7Bfill:%23b7a6ff%7D.t%7Bfill:%23e6e0ff%3Bfill-opacity:1%7D%7D%3C/style%3E%3ClinearGradient id='g' x1='.3' y1='0' x2='.7' y2='1'%3E%3Cstop class='a'/%3E%3Cstop offset='1' class='b'/%3E%3C/linearGradient%3E%3Crect width='1024' height='1024' rx='230' fill='url(%23g)'/%3E%3Cg class='w'%3E%3Crect x='130' y='431' width='47' height='162' rx='24'/%3E%3Crect x='205' y='344' width='47' height='336' rx='24'/%3E%3Crect x='280' y='251' width='47' height='522' rx='24'/%3E%3Crect x='354' y='326' width='47' height='373' rx='24'/%3E%3Crect x='429' y='406' width='47' height='211' rx='24'/%3E%3C/g%3E%3Cg class='t'%3E%3Crect x='541' y='324' width='360' height='47' rx='24'/%3E%3Crect x='541' y='434' width='298' height='47' rx='24'/%3E%3Crect x='541' y='543' width='360' height='47' rx='24'/%3E%3Crect x='541' y='652' width='211' height='47' rx='24'/%3E%3C/g%3E%3C/svg%3E">
<script>
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 1024 1024"><linearGradient id="logo-bg" x1=".3" y1="0" x2=".7" y2="1"><stop class="a"/><stop offset="1" class="b"/></linearGradient><rect width="1024" height="1024" fill="url(#logo-bg)"/><g class="w"><rect x="130" y="431" width="47" height="162" rx="24"/><rect x="205" y="344" width="47" height="336" rx="24"/><rect x="280" y="251" width="47" height="522" rx="24"/><rect x="354" y="326" width="47" height="373" rx="24"/><rect x="429" y="406" width="47" height="211" rx="24"/></g><g class="t"><rect x="541" y="324" width="360" height="47" rx="24"/><rect x="541" y="434" width="298" height="47" rx="24"/><rect x="541" y="543" width="360" height="47" rx="24"/><rect x="541" y="652" width="211" height="47" rx="24"/></g></svg>
      </span>
      <div>
        <h1>Voice Transcriber</h1>
        <p>Audio to text, on your computer</p>
      </div>
    </div>

    <section>
      <label class="label" for="language" style="display:block">Language</label>
      <div class="combo">
        <input class="select" id="language" type="text" role="combobox" aria-autocomplete="list"
          aria-expanded="false" aria-controls="language-list" autocomplete="off" spellcheck="false"
          placeholder="Type to search…">
        <ul class="listbox" id="language-list" role="listbox" aria-label="Languages" hidden></ul>
      </div>
    </section>

    <section>
      <p class="label" id="model-label">Model</p>
      <div class="models" id="models" role="radiogroup" aria-labelledby="model-label"></div>
      <p class="hint" id="model-hint"></p>
    </section>

    <section id="device-section">
      <p class="label" id="run-on">Run on</p>
      <div class="seg" role="radiogroup" aria-labelledby="run-on" id="device-seg">
        <label><input type="radio" name="device" value="gpu"> GPU</label>
        <label><input type="radio" name="device" value="cpu"> CPU</label>
      </div>
    </section>

    <div class="sidebar-foot">
      <label class="foot-row boost" title="Keeps only the most likely word at each step instead of comparing five. About 1.5× faster, almost the same accuracy.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
        <span>Speed boost <span class="soft">· about 1.5× faster</span></span>
        <input type="checkbox" role="switch" id="fast" autocomplete="off">
        <span class="track" aria-hidden="true"></span>
      </label>
      <button type="button" class="storage" id="storage" title="Open the folder with the downloaded models">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="storage-text">Models</span>
        <span class="open">Show folder</span>
      </button>
      <p class="cpu-only" id="cpu-only" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>
        Running on the CPU (no NVIDIA GPU)
      </p>
      <div class="seg icons" role="radiogroup" aria-label="Appearance">
        <label title="Match the system"><input type="radio" name="theme" value="auto"><span class="sr">Auto</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></label>
        <label title="Light"><input type="radio" name="theme" value="light"><span class="sr">Light</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></label>
        <label title="Dark"><input type="radio" name="theme" value="dark"><span class="sr">Dark</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></label>
      </div>
      <button type="button" id="quit" class="ghost" title="Stop the app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M6.3 7a8 8 0 1 0 11.4 0"/></svg>
        Quit
      </button>
    </div>
  </aside>

  <main class="content">
    <div class="content-inner">
      <label class="drop" id="drop" tabindex="0">
        <input type="file" id="picker" accept="audio/*,video/*,.ogg,.opus,.m4a,.mp3,.wav,.aac,.webm" multiple hidden>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V4m0 0-4 4m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg>
        </span>
        <span class="text-wrap">
          <strong id="drop-title">Drop audio or video files here</strong>
          <span class="sub">or click to choose. .ogg, .opus, .m4a, .mp3, .wav and more. Several at once is fine.</span>
        </span>
        <span class="using" id="using"></span>
      </label>
      <div class="list-head" id="list-head" hidden>
        <h2>Transcripts<span class="count" id="count"></span></h2>
        <div class="list-tools" id="tools" hidden>
          <button type="button" id="toggle-all">Collapse all</button>
          <button type="button" id="clear-done">Remove finished</button>
        </div>
      </div>
      <div class="results" id="results"></div>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
