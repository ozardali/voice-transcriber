<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Transcriber</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Cstyle%3E.a%7Bstop-color:%238a6cff%7D.b%7Bstop-color:%233426a8%7D.w%7Bfill:%23fff%7D.t%7Bfill:%23fff%3Bfill-opacity:.92%7D%40media (prefers-color-scheme:dark)%7B.a%7Bstop-color:%232e2650%7D.b%7Bstop-color:%23120e22%7D.w%7Bfill:%23b7a6ff%7D.t%7Bfill:%23e6e0ff%3Bfill-opacity:1%7D%7D%3C/style%3E%3ClinearGradient id='g' x1='.3' y1='0' x2='.7' y2='1'%3E%3Cstop class='a'/%3E%3Cstop offset='1' class='b'/%3E%3C/linearGradient%3E%3Crect width='1024' height='1024' rx='230' fill='url(%23g)'/%3E%3Cg class='w'%3E%3Crect x='130' y='431' width='47' height='162' rx='24'/%3E%3Crect x='205' y='344' width='47' height='336' rx='24'/%3E%3Crect x='280' y='251' width='47' height='522' rx='24'/%3E%3Crect x='354' y='326' width='47' height='373' rx='24'/%3E%3Crect x='429' y='406' width='47' height='211' rx='24'/%3E%3C/g%3E%3Cg class='t'%3E%3Crect x='541' y='324' width='360' height='47' rx='24'/%3E%3Crect x='541' y='434' width='298' height='47' rx='24'/%3E%3Crect x='541' y='543' width='360' height='47' rx='24'/%3E%3Crect x='541' y='652' width='211' height='47' rx='24'/%3E%3C/g%3E%3C/svg%3E">
<script>
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  /* Light by default. Dark when the system is dark (unless "Light" is picked)
     or when "Dark" is picked. The two dark blocks must stay the same. */
  :root {
    --bg: #f6f5fa; --panel: #efedf6; --card: #ffffff; --text: #1c1a24; --muted: #6a6778;
    --line: #e3e0ec; --accent: #4b3bd6; --accent-soft: #ebe8fc; --on-accent: #ffffff;
    --sentence: #efebff; --word: #d6ccff; --err: #b3261e;
    /* app icon colours (same as assets/AppIcon.icon) */
    --logo-a: #8a6cff; --logo-b: #3426a8; --logo-wave: #ffffff; --logo-text: rgb(255 255 255 / .92);
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131219; --panel: #18171f; --card: #1e1d27; --text: #ecebf3; --muted: #9c99ab;
      --line: #312f3d; --accent: #a796ff; --accent-soft: #272143; --on-accent: #160f33;
      --sentence: #2b2547; --word: #4c3f92; --err: #f2b8b5;
      --logo-a: #2e2650; --logo-b: #120e22; --logo-wave: #b7a6ff; --logo-text: #e6e0ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131219; --panel: #18171f; --card: #1e1d27; --text: #ecebf3; --muted: #9c99ab;
    --line: #312f3d; --accent: #a796ff; --accent-soft: #272143; --on-accent: #160f33;
    --sentence: #2b2547; --word: #4c3f92; --err: #f2b8b5;
    --logo-a: #2e2650; --logo-b: #120e22; --logo-wave: #b7a6ff; --logo-text: #e6e0ff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button {
    font: inherit; font-size: 13px; cursor: pointer; padding: 5px 12px;
    color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .ghost svg { width: 15px; height: 15px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }

  /* layout */
  .app { display: grid; grid-template-columns: 340px 1fr; min-height: 100%; }
  aside {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 22px;
    padding: 28px 22px; background: var(--panel); border-right: 1px solid var(--line);
  }
  .content { padding: 28px 36px 60px; min-width: 0; }
  .content-inner { max-width: 820px; margin: 0 auto; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .content { padding: 22px 18px 48px; }
  }

  /* sidebar */
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 22.5%; flex: none; overflow: hidden;
    box-shadow: 0 1px 3px rgb(0 0 0 / .18), inset 0 0 0 1px rgb(255 255 255 / .08);
  }
  .logo svg { display: block; width: 100%; height: 100%; }
  .logo .a { stop-color: var(--logo-a); } .logo .b { stop-color: var(--logo-b); }
  .logo .w { fill: var(--logo-wave); } .logo .t { fill: var(--logo-text); }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; line-height: 1.2; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }

  .models { display: flex; flex-direction: column; gap: 8px; }
  .model {
    position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: start;
    cursor: pointer; padding: 11px 12px; background: var(--card);
    border: 1.5px solid var(--line); border-radius: var(--radius); transition: border-color .15s, background .15s;
  }
  .model:hover { border-color: var(--accent); }
  .model input { position: absolute; opacity: 0; }
  .model .dot { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); grid-row: span 2; }
  .model:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .model:has(input:checked) .dot { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--card); background: var(--accent); }
  .model:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .model b { font-size: 14.5px; }
  .model .meta { grid-column: 2 / 4; color: var(--muted); font-size: 12.5px; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.ok { border-color: var(--accent); color: var(--accent); }

  .seg { display: flex; padding: 3px; gap: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .seg label { flex: 1; text-align: center; position: relative; padding: 6px 0; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
  .seg input { position: absolute; opacity: 0; }
  .seg label:has(input:checked) { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); }
  .seg label:has(input:disabled) { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }

  .drop {
    display: grid; place-items: center; text-align: center; min-height: 150px; padding: 20px; cursor: pointer;
    background: var(--card); border: 2px dashed var(--line); border-radius: 14px;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop.over { background: var(--accent-soft); }
  .drop strong { font-size: 15px; display: block; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 12.5px; }
  .drop svg { width: 30px; height: 30px; color: var(--accent); margin-bottom: 8px; }
  .sidebar-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }

  /* transcript list */
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; min-height: 32px; }
  .list-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  .list-head .count { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .list-tools { display: flex; gap: 6px; }
  .list-tools[hidden] { display: none; }
  .empty {
    display: grid; place-items: center; text-align: center; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 14px; padding: 60px 20px;
  }
  .empty[hidden] { display: none; }
  .empty svg { width: 34px; height: 34px; margin-bottom: 10px; opacity: .6; }

  .results { display: flex; flex-direction: column; gap: 12px; counter-reset: item; }
  .result { counter-increment: item; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .result.running { border-color: var(--accent); }
  .result.failed { border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }
  .result header {
    display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center;
    padding: 12px 10px 12px 14px; cursor: pointer; user-select: none; border-radius: var(--radius);
  }
  .result header:focus-visible { outline-offset: -2px; }
  .num {
    min-width: 26px; height: 26px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center;
    font-size: 12.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent);
  }
  .num::before { content: counter(item); }
  .result.failed .num { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }
  .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
  .result.collapsed .chev { transform: rotate(-90deg); }
  .title { min-width: 0; }
  .file { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info { display: block; color: var(--muted); font-size: 12.5px; }
  .remove {
    width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
    border-color: transparent; color: var(--muted); font-size: 18px; line-height: 1;
  }
  .remove:hover { border-color: var(--line); }
  .remove[hidden] { display: none; }
  .body { padding: 0 18px 16px 52px; }
  @media (max-width: 600px) { .body { padding-left: 16px; } }
  .result.collapsed .body { display: none; }
  .preview { display: none; color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result.collapsed .preview { display: block; }
  .wait { color: var(--muted); margin: 0; display: flex; gap: 8px; align-items: center; }
  .error { color: var(--err); margin: 0; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  /* player */
  .player {
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
    padding: 8px 14px 8px 8px; margin-bottom: 14px; background: var(--panel); border-radius: 99px;
  }
  .play {
    width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); border-color: var(--accent); color: var(--on-accent);
  }
  .play:hover:not(:disabled) { color: var(--on-accent); filter: brightness(1.08); }
  .play svg { width: 16px; height: 16px; }
  .seek { width: 100%; accent-color: var(--accent); cursor: pointer; margin: 0; }
  .time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* transcript text */
  .text { margin: 0; line-height: 1.75; }
  .sentence { border-radius: 4px; transition: background-color .15s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .sentence.now { background: var(--sentence); }
  .w { cursor: pointer; border-radius: 3px; transition: background-color .1s; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .w:hover { text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
  .w.now { background: var(--word); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .actions button { white-space: nowrap; }
  .actions .tip { margin-left: auto; color: var(--muted); font-size: 12px; }

  .stopped { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); text-align: center; padding: 20px; z-index: 10; }
  .stopped p { color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 1024 1024"><linearGradient id="logo-bg" x1=".3" y1="0" x2=".7" y2="1"><stop class="a"/><stop offset="1" class="b"/></linearGradient><rect width="1024" height="1024" fill="url(#logo-bg)"/><g class="w"><rect x="130" y="431" width="47" height="162" rx="24"/><rect x="205" y="344" width="47" height="336" rx="24"/><rect x="280" y="251" width="47" height="522" rx="24"/><rect x="354" y="326" width="47" height="373" rx="24"/><rect x="429" y="406" width="47" height="211" rx="24"/></g><g class="t"><rect x="541" y="324" width="360" height="47" rx="24"/><rect x="541" y="434" width="298" height="47" rx="24"/><rect x="541" y="543" width="360" height="47" rx="24"/><rect x="541" y="652" width="211" height="47" rx="24"/></g></svg>
      </span>
      <div>
        <h1>Voice Transcriber</h1>
        <p>Audio to English text, on your computer</p>
      </div>
    </div>

    <section>
      <p class="label">Model</p>
      <div class="models" id="models"></div>
    </section>

    <section>
      <p class="label" id="run-on">Run on</p>
      <div class="seg" role="radiogroup" aria-labelledby="run-on">
        <label><input type="radio" name="device" value="gpu"> GPU</label>
        <label><input type="radio" name="device" value="cpu"> CPU</label>
      </div>
      <p class="hint" id="device-hint">Each result shows how long it took, so you can compare.</p>
    </section>

    <section>
      <p class="label">Audio</p>
      <label class="drop" id="drop" tabindex="0">
        <input type="file" id="picker" accept="audio/*,video/*,.ogg,.opus,.m4a,.mp3,.wav,.aac,.webm" multiple hidden>
        <div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15V4m0 0-4 4m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
          </svg>
          <strong>Drop audio files here</strong>
          <span>or click to choose. Several at once is fine.</span>
        </div>
      </label>
    </section>

    <section>
      <p class="label" id="theme-label">Appearance</p>
      <div class="seg" role="radiogroup" aria-labelledby="theme-label">
        <label><input type="radio" name="theme" value="auto"> Auto</label>
        <label><input type="radio" name="theme" value="light"> Light</label>
        <label><input type="radio" name="theme" value="dark"> Dark</label>
      </div>
    </section>

    <div class="sidebar-foot">
      <span>Your audio stays on this computer.</span>
      <button type="button" id="quit" class="ghost" title="Stop the app running in the background">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M6.3 7a8 8 0 1 0 11.4 0"/></svg>
        Quit
      </button>
    </div>
  </aside>

  <main class="content">
    <div class="content-inner">
      <div class="list-head">
        <h2>Transcripts<span class="count" id="count"></span></h2>
        <div class="list-tools" id="tools" hidden>
          <button type="button" id="toggle-all">Collapse all</button>
          <button type="button" id="clear-done">Remove finished</button>
        </div>
      </div>
      <div class="empty" id="empty">
        <div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
          <p>No transcripts yet.<br>Drop an audio file anywhere on the page.</p>
        </div>
      </div>
      <div class="results" id="results"></div>
    </div>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const queue = [];
const jobs = [];
let busy = false;

const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

// settings

async function loadModels() {
  const data = await fetch("/api/models").then((r) => r.json());
  const saved = localStorage.getItem("model") || data.default;
  $("models").innerHTML = data.models.map((m) => `
    <label class="model">
      <input type="radio" name="model" value="${m.id}" ${m.id === saved ? "checked" : ""}>
      <span class="dot" aria-hidden="true"></span>
      <b>${m.name}</b>
      <span class="tag ${m.downloaded ? "ok" : ""}">${m.downloaded ? "ready" : "not downloaded"}</span>
      <span class="meta">${m.note}<br>${m.model} · ${m.size}</span>
    </label>`).join("");
  if (!document.querySelector("input[name=model]:checked")) {
    document.querySelector("input[name=model]").checked = true;
  }
  document.querySelectorAll("input[name=model]").forEach((r) =>
    r.addEventListener("change", () => localStorage.setItem("model", r.value)));

  const gpu = document.querySelector("input[name=device][value=gpu]");
  gpu.disabled = !data.gpu;
  const savedDevice = data.gpu ? (localStorage.getItem("device") || "gpu") : "cpu";
  document.querySelector(`input[name=device][value=${savedDevice}]`).checked = true;
  if (!data.gpu) $("device-hint").textContent = "No usable graphics card found, so everything runs on the CPU.";
}

document.querySelectorAll("input[name=device]").forEach((r) =>
  r.addEventListener("change", () => localStorage.setItem("device", r.value)));

const selectedModel = () => document.querySelector("input[name=model]:checked")?.value;
const selectedDevice = () => document.querySelector("input[name=device]:checked")?.value || "gpu";

// list

// WhatsApp file names contain the timestamp, so name order = recording order
const byName = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });

function addFiles(files) {
  const sorted = [...files].sort((a, b) => byName.compare(a.name, b.name));
  for (const file of sorted) {
    const card = document.createElement("article");
    card.className = "result";
    card.innerHTML = `
      <header tabindex="0" role="button" aria-expanded="true">
        <span class="num" aria-hidden="true"></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        <span class="title"><span class="file"></span><span class="info">queued</span><span class="preview"></span></span>
        <button type="button" class="remove" aria-label="Remove from list" title="Remove">×</button>
      </header>
      <div class="body"><p class="wait"><span class="spin"></span><span>Waiting…</span></p></div>`;
    card.querySelector(".file").textContent = file.name;
    card.querySelector(".file").title = file.name;
    const job = { file, card, model: selectedModel(), device: selectedDevice(), state: "queued" };
    const header = card.querySelector("header");
    header.addEventListener("click", () => setCollapsed(job, !card.classList.contains("collapsed")));
    header.addEventListener("keydown", (ev) => {
      if (ev.target === header && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); header.click(); }
    });
    card.querySelector(".remove").addEventListener("click", (ev) => { ev.stopPropagation(); removeJob(job); });
    jobs.push(job);
    queue.push(job);
    $("results").append(card);
  }
  updateList();
  runQueue();
}

function setCollapsed(job, collapsed) {
  job.card.classList.toggle("collapsed", collapsed);
  job.card.querySelector("header").setAttribute("aria-expanded", String(!collapsed));
  if (collapsed) job.audio?.pause();
  updateList();
}

function removeJob(job) {
  if (job.state === "running") return;
  const qi = queue.indexOf(job);
  if (qi !== -1) queue.splice(qi, 1);
  jobs.splice(jobs.indexOf(job), 1);
  if (job.audio) { job.audio.pause(); URL.revokeObjectURL(job.audio.src); }
  job.card.remove();
  updateList();
}

function updateList() {
  $("empty").hidden = jobs.length > 0;
  $("tools").hidden = jobs.length === 0;
  $("count").textContent = jobs.length ? ` · ${jobs.length}` : "";
  const allCollapsed = jobs.length > 0 && jobs.every((j) => j.card.classList.contains("collapsed"));
  $("toggle-all").textContent = allCollapsed ? "Expand all" : "Collapse all";
  $("clear-done").disabled = !jobs.some((j) => j.state === "done" || j.state === "error");
  for (const j of jobs) {
    j.card.querySelector(".remove").hidden = j.state === "running";
    j.card.classList.toggle("running", j.state === "running");
    j.card.classList.toggle("failed", j.state === "error");
  }
}

$("toggle-all").addEventListener("click", () => {
  const collapse = !jobs.every((j) => j.card.classList.contains("collapsed"));
  jobs.forEach((j) => setCollapsed(j, collapse));
});
$("clear-done").addEventListener("click", () => {
  jobs.filter((j) => j.state === "done" || j.state === "error").forEach(removeJob);
});

// transcription

async function runQueue() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    const job = queue.shift();
    job.state = "running";
    updateList();
    await transcribe(job);
    updateList();
  }
  busy = false;
}

async function transcribe(job) {
  const { file, card, model, device } = job;
  const box = card.querySelector(".body");
  const info = card.querySelector(".info");
  const firstUse = !document.querySelector(`input[name=model][value="${model}"]`)
    ?.closest(".model").querySelector(".tag.ok");
  info.textContent = "transcribing";
  card.querySelector(".preview").textContent = "Transcribing…";
  card.querySelector(".wait span:last-child").textContent =
    firstUse ? "Downloading the model, then transcribing. The first run takes a while…" : "Transcribing…";

  const form = new FormData();
  form.append("file", file);
  form.append("model", model);
  form.append("device", device);
  let data;
  try {
    data = await fetch("/api/transcribe", { method: "POST", body: form }).then((r) => r.json());
  } catch (e) {
    data = { error: "Could not reach the app. Is it still running?" };
  }
  box.innerHTML = "";

  if (data.error) {
    job.state = "error";
    info.textContent = "error";
    card.querySelector(".preview").textContent = data.error;
    const p = document.createElement("p");
    p.className = "error";
    p.textContent = data.error;
    box.append(p);
    return;
  }

  job.state = "done";
  const ran = data.device === "cuda" ? "GPU" : "CPU";
  const fellBack = device === "gpu" && ran === "CPU" ? " (GPU unavailable)" : "";
  const load = data.load > 0 ? ` + ${data.load}s loading the model` : "";
  info.textContent = `${data.model} · ${ran}${fellBack} · ${fmtLong(data.duration)} audio · took ${data.elapsed}s${load}`;
  card.querySelector(".preview").textContent = data.text || "(No speech found.)";

  box.append(buildPlayer(job, data.duration));
  box.append(buildText(job, data));
  box.append(buildActions(job, data.text));
  if (firstUse) loadModels();
}

// player + highlight

function buildPlayer(job, duration) {
  const audio = new Audio(URL.createObjectURL(job.file));
  audio.preload = "metadata";
  job.audio = audio;

  const el = document.createElement("div");
  el.className = "player";
  el.innerHTML = `
    <button type="button" class="play" aria-label="Play">${ICON_PLAY}</button>
    <input type="range" class="seek" min="0" step="0.01" value="0" aria-label="Position">
    <span class="time">0:00 / ${fmt(duration)}</span>`;
  const play = el.querySelector(".play");
  const seek = el.querySelector(".seek");
  const time = el.querySelector(".time");
  seek.max = duration;

  play.addEventListener("click", () => (audio.paused ? playOnly(job) : audio.pause()));
  seek.addEventListener("input", () => { audio.currentTime = Number(seek.value); highlight(job); });
  audio.addEventListener("loadedmetadata", () => {
    if (isFinite(audio.duration)) { seek.max = audio.duration; time.textContent = `0:00 / ${fmt(audio.duration)}`; }
  });
  audio.addEventListener("play", () => { setIcon(play, true); tick(job); });
  audio.addEventListener("pause", () => setIcon(play, false));
  audio.addEventListener("ended", () => { setIcon(play, false); clearHighlight(job); });
  audio.addEventListener("timeupdate", () => {
    seek.value = audio.currentTime;
    time.textContent = `${fmt(audio.currentTime)} / ${fmt(Number(seek.max))}`;
    if (audio.paused) highlight(job);
  });
  return el;
}

function setIcon(button, playing) {
  button.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  button.setAttribute("aria-label", playing ? "Pause" : "Play");
}

function playOnly(job) {
  for (const j of jobs) if (j !== job) j.audio?.pause();
  job.audio.play();
}

// whisper segments can span several sentences, so split on . ! ? ourselves
function buildText(job, data) {
  const p = document.createElement("p");
  p.className = "text";
  const words = (data.segments || []).flatMap((s) => s.words);
  job.words = [];
  job.sentences = [];
  if (!words.length) {
    p.textContent = data.text || "(No speech found.)";
    return p;
  }
  let sentence = null;
  words.forEach((w, i) => {
    // keep whisper's spacing, otherwise "rip-off" becomes "rip -off"
    const space = i > 0 && /^\s/.test(w.word) ? " " : "";
    if (!sentence) {
      sentence = document.createElement("span");
      sentence.className = "sentence";
      job.sentences.push({ el: sentence, start: w.start, end: w.end });
      if (space) p.append(space);
    } else if (space) {
      sentence.append(space);
    }
    const span = document.createElement("span");
    span.className = "w";
    span.textContent = w.word.trim();
    span.addEventListener("click", () => {
      job.audio.currentTime = w.start;
      playOnly(job);
    });
    sentence.append(span);
    job.words.push({ el: span, start: w.start, end: w.end });
    job.sentences.at(-1).end = w.end;
    if (/[.!?]["')\]]*$/.test(w.word.trim())) {
      p.append(sentence);
      sentence = null;
    }
  });
  if (sentence) p.append(sentence);
  return p;
}

function buildActions(job, text) {
  const actions = document.createElement("div");
  actions.className = "actions";
  const copy = button("Copy", async () => {
    await navigator.clipboard.writeText(text);
    copy.textContent = "Copied";
    setTimeout(() => (copy.textContent = "Copy"), 1500);
  });
  const save = button("Save .txt", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text + "\n"], { type: "text/plain" }));
    a.download = job.file.name.replace(/\.[^.]+$/, "") + ".txt";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  const tip = document.createElement("span");
  tip.className = "tip";
  if (job.words.length) tip.textContent = "Click a word to play from there";
  actions.append(copy, save, tip);
  return actions;
}

// timeupdate only fires ~4x/sec, too choppy for word highlight
function tick(job) {
  if (job.audio.paused) return;
  highlight(job);
  requestAnimationFrame(() => tick(job));
}

function findAt(list, t) {
  let lo = 0, hi = list.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (list[mid].start <= t) { found = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return found;
}

function highlight(job) {
  if (!job.words?.length) return;
  const t = job.audio.currentTime;
  const wi = findAt(job.words, t);
  const si = findAt(job.sentences, t);
  setNow(job, "word", wi >= 0 ? job.words[wi].el : null);
  const s = si >= 0 && t <= job.sentences[si].end + 0.6 ? job.sentences[si].el : null;
  setNow(job, "sentence", s);
  if (!job.audio.paused && wi >= 0 && wi !== job.lastScrolled) {
    job.lastScrolled = wi;
    keepVisible(job.words[wi].el);
  }
}

function setNow(job, kind, el) {
  const key = "now_" + kind;
  if (job[key] === el) return;
  job[key]?.classList.remove("now");
  el?.classList.add("now");
  job[key] = el;
}

function clearHighlight(job) {
  setNow(job, "word", null);
  setNow(job, "sentence", null);
}

function keepVisible(el) {
  const r = el.getBoundingClientRect();
  if (r.top < 80 || r.bottom > window.innerHeight - 80) {
    el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

// helpers

function button(label, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

function fmtLong(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m ? `${m}m ${s}s` : `${s}s`;
}

// drag and drop

const drop = $("drop");
["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (ev) => addFiles(ev.dataTransfer.files));
drop.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); $("picker").click(); } });
$("picker").addEventListener("change", (ev) => { addFiles(ev.target.files); ev.target.value = ""; });
window.addEventListener("dragover", (ev) => ev.preventDefault());
window.addEventListener("drop", (ev) => {
  ev.preventDefault();
  if (ev.target.closest?.(".drop") === null && ev.dataTransfer.files.length) addFiles(ev.dataTransfer.files);
});

// space = play/pause the last used recording
document.addEventListener("keydown", (ev) => {
  if (ev.key !== " " || ev.target.closest("button, input, header, label, [tabindex]")) return;
  const playing = jobs.find((j) => j.audio && !j.audio.paused);
  const last = playing || jobs.findLast((j) => j.audio && j.audio.currentTime > 0);
  if (!last) return;
  ev.preventDefault();
  last.audio.paused ? playOnly(last) : last.audio.pause();
});

// appearance: auto follows the system
const themeNow = document.documentElement.dataset.theme || "auto";
document.querySelectorAll('input[name="theme"]').forEach((r) => {
  r.checked = r.value === themeNow;
  r.addEventListener("change", () => {
    if (r.value === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = r.value;
    try { localStorage.setItem("theme", r.value); } catch {}
  });
});

$("quit").addEventListener("click", async () => {
  if (busy && !confirm("A file is still being transcribed. Quit anyway?")) return;
  try {
    await fetch("/api/quit", { method: "POST", headers: { "X-Voice-Transcriber": "1" } });
  } catch (e) {}
  const done = document.createElement("div");
  done.className = "stopped";
  done.innerHTML = "<div><h1>App stopped</h1><p>You can close this tab. Start it again from the Voice Transcriber icon.</p></div>";
  document.body.append(done);
});

loadModels();
</script>
</body>
</html>
