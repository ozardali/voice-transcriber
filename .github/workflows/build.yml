name: Build apps

# Run by hand (Actions tab -> Build apps -> Run workflow), or push a tag like
# v1.0.0 to build both and attach them to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which apps to build
        type: choice
        options: [windows, mac, both]
        default: windows
  push:
    tags: ["v*"]

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platforms != 'mac'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        shell: pwsh
        run: packaging\build-windows.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          # start the packaged app without a window and check that it answers
          $env:NO_BROWSER = "1"
          $p = Start-Process "dist\Voice Transcriber\Voice Transcriber.exe" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:7860/api/models | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:LOCALAPPDATA\Voice Transcriber\app.log" -ErrorAction SilentlyContinue; throw "The app did not start" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*-setup.exe

  mac:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'windows')
    runs-on: macos-15  # Apple Silicon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: PYTHON=python3.12 packaging/build-mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
